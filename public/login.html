<!DOCTYPE html>
<html lang="it" data-project="videochat">
<head>
  <meta charset="UTF-8" />
  <script src="/assets/i18n/catalog.js"></script>
  <script src="/assets/i18n/i18n.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#121318" />
  <title>Accedi · %%APP_NAME%%</title>
  <link rel="icon" href="%%FAVICON%%" />
  <link rel="stylesheet" href="/assets/css/fonts.css" />
  <link rel="stylesheet" href="/assets/css/tdt-base.css" />
  <link rel="stylesheet" href="/assets/css/tdt-app.css" />
  %%BRAND_HEAD%%
  <script src="/assets/js/theme.js"></script>

  <link rel="stylesheet" href="/assets/i18n/i18n.css">
</head>
<body class="tdt-app">
  <div class="auth-beam" aria-hidden="true"></div>
  <div class="auth-wrap">
    <div class="auth-box">
      <div class="auth-logo">
        <img src="%%LOGO%%" alt="" />
        <div>
          <div class="auth-logo-name">%%APP_NAME%%</div>
          <div class="auth-logo-sub">%%TAGLINE%%</div>
        </div>
      </div>
      <div class="card">
        <h1 class="card-title">Accedi</h1>
        <p class="card-sub">Serve un account solo a chi organizza le riunioni. Gli ospiti entrano dal link di invito.</p>
        <div class="field">
          <label for="username">Nome utente</label>
          <input type="text" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" />
        </div>
        <button class="btn btn-block" id="btnLogin">Entra</button>
        <div class="alert alert-error hidden" id="errorMsg" style="margin-top:14px"></div>
      </div>
      <div style="display:flex;justify-content:center;margin-top:16px"><button class="icon-btn" data-theme-toggle data-tip="Cambia tema">
        <span class="ico-dark"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></svg></span><span class="ico-light hidden"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.6 8.6 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg></span>
      </button></div>
    </div>
  </div>
  <script src="/assets/js/tooltip.js"></script>
  <script src="/assets/js/app.js"></script>
  <script>
    // ?next=... → dove tornare dopo il login
    (function () {
      const params = new URLSearchParams(window.location.search);
      const next = params.get('next');
      try {
        if (next) {
          sessionStorage.setItem('tdmeet_next', next);
          window.history.replaceState({}, '', '/');
        } else if (params.get('room')) {
          sessionStorage.setItem('tdmeet_next', '/home?' + params.toString());
        }
      } catch (e) { }
    })();
    function nextUrl() {
      try {
        const n = sessionStorage.getItem('tdmeet_next');
        if (n && n.startsWith('/')) { sessionStorage.removeItem('tdmeet_next'); return n; }
      } catch (e) { }
      return '/home';
    }

    const errorMsg = document.getElementById('errorMsg');
    const usernameEl = document.getElementById('username');
    const passwordEl = document.getElementById('password');
    const btnLogin = document.getElementById('btnLogin');

    // già loggato → vai avanti
    (async () => {
      const token = Tdt.token();
      if (!token) { usernameEl.focus(); return; }
      try {
        const r = await fetch('/api/auth/verify', { headers: { 'x-auth-token': token } });
        if (r.ok) { window.location.href = nextUrl(); return; }
      } catch (e) { }
      localStorage.removeItem('tdmeet_token');
      localStorage.removeItem('tdmeet_user');
      usernameEl.focus();
    })();

    function showError(msg) { errorMsg.textContent = msg; errorMsg.classList.remove('hidden'); }

    async function login() {
      const username = usernameEl.value.trim();
      const password = passwordEl.value;
      if (!username || !password) { showError('Inserisci nome utente e password'); return; }
      errorMsg.classList.add('hidden');
      btnLogin.disabled = true; btnLogin.textContent = 'Un attimo…';
      try {
        const res = await fetch('/api/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Accesso non riuscito');
        localStorage.setItem('tdmeet_token', data.token);
        localStorage.setItem('tdmeet_user', data.displayName);
        localStorage.setItem('vc_displayName', data.displayName);
        window.location.href = nextUrl();
      } catch (e) {
        showError(e.message);
        btnLogin.disabled = false; btnLogin.textContent = 'Entra';
        passwordEl.select();
      }
    }
    btnLogin.addEventListener('click', login);
    passwordEl.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
    usernameEl.addEventListener('keydown', e => { if (e.key === 'Enter') passwordEl.focus(); });
  </script>
</body>
</html>
