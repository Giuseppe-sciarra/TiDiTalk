<!DOCTYPE html>
<html lang="it" data-project="videochat">
<head>
  <meta charset="UTF-8" />
  <script src="/assets/i18n/catalog.js"></script>
  <script src="/assets/i18n/i18n.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#121318" />
  <title>Pianifica · %%APP_NAME%%</title>
  <link rel="icon" href="%%FAVICON%%" />
  <link rel="stylesheet" href="/assets/css/fonts.css" />
  <link rel="stylesheet" href="/assets/css/tdt-base.css" />
  <link rel="stylesheet" href="/assets/css/tdt-app.css" />
  <style>
    .settings-layout.schedule-layout { grid-template-columns: minmax(0, 1fr) 520px; }
    .schedule-date-row { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
    .schedule-date-row > .field { min-width: 0; }
    @media (max-width: 960px) {
      .settings-layout.schedule-layout { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 560px) {
      .schedule-date-row { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
  %%BRAND_HEAD%%
  <script src="/assets/js/theme.js"></script>

  <link rel="stylesheet" href="/assets/i18n/i18n.css">
</head>
<body class="tdt-app">
  <header class="app-header">
    <a href="/home" class="app-brand"><img src="%%LOGO%%" alt="" /><span>%%APP_NAME%%</span></a>
    <nav class="app-nav">
      <a href="/home" class="nav-link">Riunioni</a><a href="/schedule" class="nav-link active">Pianifica</a>
      <a href="/settings" class="nav-link hidden" data-admin-only data-tip="Impostazioni della piattaforma"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.5a1.6 1.6 0 0 0 .3 1.8 2 2 0 1 1-2.8 2.8 1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5 2 2 0 1 1-4 0 1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3 2 2 0 1 1-2.8-2.8 1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1 2 2 0 1 1 0-4 1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8 2 2 0 1 1 2.8-2.8 1.6 1.6 0 0 0 1.8.3 1.6 1.6 0 0 0 1-1.5 2 2 0 1 1 4 0 1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3 2 2 0 1 1 2.8 2.8 1.6 1.6 0 0 0-.3 1.8 1.6 1.6 0 0 0 1.5 1 2 2 0 1 1 0 4 1.6 1.6 0 0 0-1.5 1z"/></svg></a>
      <button class="icon-btn" data-theme-toggle data-tip="Cambia tema">
        <span class="ico-dark"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></svg></span><span class="ico-light hidden"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.6 8.6 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg></span>
      </button>
      <button class="nav-link" data-logout type="button">Esci</button>
    </nav>
  </header>
  <div class="page">
    <h1 class="page-title">Riunioni pianificate</h1>
    <p class="page-sub">Chi inviti riceve un'email con il link e l'evento da aggiungere al calendario. Il link resta valido fino a fine riunione.</p>
    <div class="settings-layout schedule-layout">
      <div>
        <div id="meetingsList"><div class="empty">Carico…</div></div>
      </div>
      <div class="card" style="position:sticky;top:84px">
        <h2 class="card-title">Nuova riunione</h2>
        <p class="card-sub">Titolo, quando, chi invitare. Al resto pensiamo noi.</p>
        <div class="field">
          <label for="fTitle">Titolo</label>
          <input type="text" id="fTitle" placeholder="Allineamento progetto" maxlength="80" />
        </div>
        <div class="grid-2 schedule-date-row">
          <div class="field">
            <label for="fDate">Data e ora</label>
            <input type="datetime-local" id="fDate" />
          </div>
          <div class="field">
            <label for="fDuration">Durata</label>
            <select id="fDuration">
              <option value="30">30 minuti</option>
              <option value="60" selected>1 ora</option>
              <option value="90">1 ora e mezza</option>
              <option value="120">2 ore</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="inviteeInput">Invitati</label>
          <div class="chips" id="inviteesList"></div>
          <div style="display:flex;gap:8px;margin-top:8px">
            <input type="email" id="inviteeInput" placeholder="nome@azienda.it" list="inviteeSuggestions" autocomplete="off" />
            <datalist id="inviteeSuggestions"></datalist>
            <button class="btn btn-ghost btn-sm" id="btnAddInvitee" type="button">Aggiungi</button>
          </div>
        </div>
        <div class="field">
          <label for="fNotes">Note (facoltative)</label>
          <textarea id="fNotes" placeholder="Ordine del giorno, link ai documenti…"></textarea>
        </div>
        <button class="btn btn-block" id="btnCreate">Pianifica e invia gli inviti</button>
        <div class="alert hidden" id="formResult" style="margin-top:12px"></div>
      </div>
    </div>
  </div>
  <script src="/assets/js/tooltip.js"></script>
  <script src="/assets/js/app.js"></script>
  <script>
    const invitees = [];
    (async () => { if (!await Tdt.requireAuth()) return; loadMeetings(); loadSuggestions(); })();

    // data di default: domani alle 10:00 ORA LOCALE (prima usava l'orario UTC
    // e proponeva un orario sbagliato di 1-2 ore)
    (function () {
      const d = new Date();
      d.setDate(d.getDate() + 1);
      d.setHours(10, 0, 0, 0);
      const p = (n) => String(n).padStart(2, '0');
      document.getElementById('fDate').value =
        `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
    })();

    function renderInvitees() {
      const list = document.getElementById('inviteesList');
      if (!invitees.length) { list.innerHTML = '<span class="hint" style="padding:5px 6px">Nessun invitato: la riunione resterà solo tua.</span>'; return; }
      list.innerHTML = invitees.map((e, i) => `<span class="chip">${Tdt.esc(e)}<button type="button" data-i="${i}" aria-label="Togli">×</button></span>`).join('');
      list.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { invitees.splice(+b.dataset.i, 1); renderInvitees(); }));
    }
    renderInvitees();

    function addInvitee() {
      const input = document.getElementById('inviteeInput');
      const email = input.value.trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { Tdt.toast('Indirizzo email non valido'); input.focus(); return; }
      if (!invitees.includes(email)) invitees.push(email);
      input.value = ''; input.focus(); renderInvitees();
    }
    document.getElementById('btnAddInvitee').addEventListener('click', addInvitee);
    document.getElementById('inviteeInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addInvitee(); } });

    async function loadSuggestions() {
      try {
        const emails = await Tdt.api('/api/invitees');
        document.getElementById('inviteeSuggestions').innerHTML =
          (emails || []).map(e => `<option value="${Tdt.esc(e)}"></option>`).join('');
      } catch (e) { }
    }

    async function loadMeetings() {
      try { render(await Tdt.api('/api/meetings')); }
      catch (e) { document.getElementById('meetingsList').innerHTML = '<div class="empty">Non riesco a caricare le riunioni.</div>'; }
    }

    function render(meetings) {
      const el = document.getElementById('meetingsList');
      if (!meetings.length) { el.innerHTML = '<div class="empty">Ancora nessuna riunione in calendario.<br>Creane una qui a fianco.</div>'; return; }
      const now = Date.now() / 1000;
      el.innerHTML = meetings.map(m => {
        const dt = new Date(m.scheduled_at * 1000);
        const dateStr = dt.toLocaleDateString(I18n.locale, { weekday: 'short', day: 'numeric', month: 'long' });
        const timeStr = dt.toLocaleTimeString(I18n.locale, { hour: '2-digit', minute: '2-digit' });
        const isPast = m.scheduled_at < now - 3600;
        const isNow = !isPast && m.scheduled_at < now + 300;
        const isSoon = !isPast && !isNow && m.scheduled_at < now + 1800;
        return `
        <div class="meeting-card${isPast ? ' past' : ''}" style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
            <div style="min-width:0">
              <div class="meeting-title">${Tdt.esc(m.title)}</div>
              <div class="meeting-meta">
                <span>${Tdt.esc(dateStr.charAt(0).toUpperCase() + dateStr.slice(1))}</span>
                <span>ore ${timeStr}</span>
                <span>${m.duration_min} min</span>
                <span>stanza ${Tdt.esc(m.room_id)}</span>
              </div>
              ${m.invitees.length ? `<div class="hint">${m.invitees.length} invitat${m.invitees.length === 1 ? 'o' : 'i'}: ${Tdt.esc(m.invitees.join(', '))}</div>` : ''}
            </div>
            ${isNow ? '<span class="badge badge-live">In corso</span>' : isSoon ? '<span class="badge badge-soon">Tra poco</span>' : ''}
          </div>
          <div class="meeting-actions">
            <button class="btn btn-sm" data-act="join" data-room="${Tdt.esc(m.room_id)}">Entra</button>
            <button class="btn btn-ghost btn-sm" data-act="copy" data-room="${Tdt.esc(m.room_id)}">Copia link d'invito</button>
            ${!isPast ? `<button class="btn btn-danger btn-sm" data-act="del" data-id="${Tdt.esc(m.id)}">Elimina</button>` : ''}
          </div>
        </div>`;
      }).join('');

      el.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', async () => {
        const { act, room, id } = b.dataset;
        if (act === 'join') return window.open(`/room/${room}`, '_blank', 'noopener');
        if (act === 'copy') {
          try {
            const { url } = await Tdt.api(`/api/room/${room}/invite`, { method: 'POST' });
            await navigator.clipboard.writeText(url);
            b.textContent = 'Copiato';
            setTimeout(() => b.textContent = "Copia link d'invito", 2000);
          } catch (e) { Tdt.toast(e.message); }
        }
        if (act === 'del') {
          if (!confirm('Eliminare questa riunione? Gli invitati non riceveranno alcun avviso.')) return;
          try { await Tdt.api(`/api/meetings/${id}`, { method: 'DELETE' }); loadMeetings(); }
          catch (e) { Tdt.toast(e.message); }
        }
      }));
    }

    document.getElementById('btnCreate').addEventListener('click', async () => {
      const title = document.getElementById('fTitle').value.trim();
      const dateVal = document.getElementById('fDate').value;
      const duration = parseInt(document.getElementById('fDuration').value, 10);
      const notes = document.getElementById('fNotes').value.trim();
      const out = document.getElementById('formResult');
      const btn = document.getElementById('btnCreate');
      const fail = (msg) => { out.className = 'alert alert-error'; out.textContent = msg; };

      out.className = 'alert hidden';
      if (!title) return fail('Manca il titolo');
      if (!dateVal) return fail('Manca data e ora');

      btn.disabled = true; btn.textContent = 'Creo la riunione…';
      try {
        const data = await Tdt.api('/api/meetings', {
          method: 'POST',
          body: JSON.stringify({ title, scheduled_at: new Date(dateVal).toISOString(), duration_min: duration, invitees, notes }),
        });
        const sent = (data.emailResults || []).filter(e => e.sent).length;
        const failed = (data.emailResults || []).filter(e => !e.sent);
        out.className = 'alert alert-ok';
        out.textContent = sent
          ? `Riunione creata: ${sent} email inviate.`
          : invitees.length
            ? 'Riunione creata, ma le email non sono partite: controlla SMTP nelle impostazioni. Intanto usa "Copia link d\'invito".'
            : 'Riunione creata.';
        if (failed.length) out.textContent += ` Non consegnate: ${failed.map(f => f.email).join(', ')}.`;
        document.getElementById('fTitle').value = '';
        document.getElementById('fNotes').value = '';
        invitees.length = 0; renderInvitees();
        loadMeetings();
      } catch (e) {
        fail(e.message);
      } finally {
        btn.disabled = false; btn.textContent = 'Pianifica e invia gli inviti';
      }
    });

    setInterval(loadMeetings, 60000);
  </script>
</body>
</html>
