<!DOCTYPE html>
<html lang="it" class="tdt" data-project="videochat" data-sz-popup="1">

<head>
  <meta charset="UTF-8" />
  <script src="/assets/i18n/catalog.js"></script>
  <script src="/assets/i18n/i18n.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#121318" />
  <!-- 1.8.2: finestra separata dello schermo condiviso (screenzoom.js). Usa lo
       stesso flusso video della riunione che l'ha aperta (window.opener). -->
  <title>Schermo condiviso · %%APP_NAME%%</title>
  <link rel="icon" href="%%FAVICON%%" />
  <link rel="stylesheet" href="/assets/css/fonts.css" />
  <link rel="stylesheet" href="/assets/css/tdt-base.css" />
  <link rel="stylesheet" href="/assets/css/screenzoom.css" />
  %%BRAND_HEAD%%
  <link rel="stylesheet" href="/assets/i18n/i18n.css">
</head>

<body class="tdt-room sz-popup-page">
  <div class="sz-pop-host" id="szHost">
    <video autoplay playsinline muted disablepictureinpicture></video>
    <canvas class="sz-pop-ann" aria-hidden="true"></canvas>
  </div>
  <div class="sz-pop-chip" id="szChip" aria-hidden="true"><span class="sz-dot"></span><span>Schermo condiviso</span></div>
  <div class="sz-pop-msg" id="szMsg" role="status" aria-live="polite">
    <div class="tdt-beacon" aria-hidden="true"><i></i></div>
    <b>Collegamento allo schermo condiviso…</b>
    <span></span>
    <button type="button" class="sz-pn-btn hidden">Chiudi la finestra</button>
  </div>

  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/tooltip.js"></script>
  <script src="/assets/js/screenzoom.js"></script>
</body>

</html>
