<!DOCTYPE html>
<html lang="it" data-project="videochat">
<head>
  <meta charset="UTF-8" />
  <script src="/assets/i18n/catalog.js"></script>
  <script src="/assets/i18n/i18n.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#121318" />
  <title>Grazie · %%APP_NAME%%</title>
  <link rel="icon" href="%%FAVICON%%" />
  <link rel="stylesheet" href="/assets/css/fonts.css" />
  <link rel="stylesheet" href="/assets/css/tdt-base.css" />
  <link rel="stylesheet" href="/assets/css/tdt-app.css" />
  <link rel="stylesheet" href="/assets/css/bye.css" />
  %%BRAND_HEAD%%
  <script src="/assets/js/theme.js"></script>
  <link rel="stylesheet" href="/assets/i18n/i18n.css">
</head>
<body class="tdt-app tdt-bye">
  <div class="auth-beam" aria-hidden="true"></div>
  <main class="bye-wrap">
    <div class="bye-split" id="byeSplit">
      <section class="bye-brand" id="byeBrand">
        <div class="bye-logo">
          <img src="%%LOGO%%" alt="" />
          <b translate="no">%%APP_NAME%%</b>
        </div>
        <div class="bye-brand-body">
          <h1 id="byeTitle">Grazie.<br>È stato un piacere.</h1>
          <p id="byeSubtitle">La chiamata è finita. A presto!</p>
          <div class="bye-quote hidden" id="byeQuote"></div>
        </div>
      </section>
      <section class="bye-content">
        <span class="bye-pill">Fine chiamata</span>
        <h2 id="byeHeading">Chiamata conclusa</h2>
        <p class="bye-text" id="byeText"></p>
        <div class="bye-stage" id="byeStage"><canvas class="bye-net" id="byeNet"></canvas></div>
        <div class="bye-stats hidden" id="byeStats"></div>
        <div class="bye-rating hidden" id="byeRating">
          <div class="bye-rating-q">Com'è andata la chiamata?</div>
          <div class="bye-stars" id="byeStars" role="radiogroup" aria-label="Voto">
            <button type="button" data-v="1" aria-label="1">★</button><button type="button" data-v="2" aria-label="2">★</button><button type="button" data-v="3" aria-label="3">★</button><button type="button" data-v="4" aria-label="4">★</button><button type="button" data-v="5" aria-label="5">★</button>
          </div>
          <textarea class="bye-comment hidden" id="byeComment" maxlength="500" placeholder="Vuoi aggiungere qualcosa? (facoltativo)"></textarea>
          <div class="bye-rating-actions hidden" id="byeRatingActions">
            <button type="button" class="btn" id="byeSend">Invia</button>
          </div>
          <div class="bye-rating-done hidden" id="byeRatingDone">Grazie del voto!</div>
        </div>
        <div class="bye-contact hidden" id="byeContact"></div>
        <div class="bye-actions" id="byeActions"></div>
        <div class="bye-foot" id="byeFoot"></div>
      </section>
    </div>
    <!-- fuori dalla card, sopra i crediti -->
    <button type="button" class="bye-close" id="byeClose"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg><span>Chiudi</span></button>
  </main>
  <script src="/assets/js/app.js"></script>
  <script src="/assets/js/bye.js"></script>
</body>
</html>
